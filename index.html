<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e5df;--surface:#eef0ea;--raise:#f6f7f2;--ink:#1d2528;--muted:#566366;--line:#c3c9c1;--accent:#8a6a22;--moss:#4c6540;
  --panel:rgba(238,240,234,.86);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;--sans:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#192022;--surface:#21292b;--raise:#283133;--ink:#e4e7e0;--muted:#9ba7a8;--line:#36403f;--accent:#d3a94e;--moss:#8fab78;--panel:rgba(25,32,34,.84);}}
:root[data-theme="dark"]{--bg:#192022;--surface:#21292b;--raise:#283133;--ink:#e4e7e0;--muted:#9ba7a8;--line:#36403f;--accent:#d3a94e;--moss:#8fab78;--panel:rgba(25,32,34,.84);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
img{max-width:100%;display:block}

/* library */
.shell{max-width:1240px;margin:0 auto;padding:28px clamp(18px,4vw,48px) 80px}
.top{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--serif);font-weight:700;font-size:1.35rem;text-decoration:none;letter-spacing:.01em}
.mark::before{content:"";display:inline-block;width:.62em;height:.62em;margin-right:.45em;background:var(--accent);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);transform:translateY(-.02em)}
.crumbs{display:flex;gap:.5em;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs [aria-current]{color:var(--ink)}
.intro{padding:56px 0 36px;max-width:42rem}
.intro h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.4rem,5.4vw,3.9rem);line-height:1.04;margin:0 0 .35em;letter-spacing:-.01em}
.intro p{margin:0;color:var(--muted);font-size:1.12rem;max-width:36rem}

.shelves{list-style:none;margin:0 0 40px;padding:0}
.shelves li{border-top:1px solid var(--line)}.shelves li:last-child{border-bottom:1px solid var(--line)}
.shelf{display:grid;grid-template-columns:minmax(190px,1fr) 2.6fr;gap:28px;align-items:center;padding:26px 0;text-decoration:none}
.shelf-label{display:flex;flex-direction:column;gap:2px}
.shelf-name{font-family:var(--serif);font-size:2.1rem;line-height:1.1;font-weight:500}
.shelf-blurb{color:var(--muted)}
.shelf-count{margin-top:10px;font-size:.92rem;color:var(--moss);font-weight:500}
.shelf:hover .shelf-name{color:var(--accent)}
.shelf-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:96px}
.slot-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:3px;color:var(--muted);font-size:.95rem;min-height:110px}
.thumb{display:block;aspect-ratio:4/3;background:var(--surface);border-radius:3px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.thumb.ready img{opacity:1}
.thumb:not(.ready)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--raise) 80%,transparent) 50%,transparent 70%);background-size:200% 100%;animation:sheen 1.4s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-80% 0}}

.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 26px}
.card{display:flex;flex-direction:column;text-decoration:none}
.card .thumb{margin-bottom:12px}
.card-name{font-family:var(--serif);font-size:1.32rem;font-weight:500;line-height:1.2}
.card-meta{color:var(--muted);font-size:.93rem}
.card:hover .card-name{color:var(--accent)}
.card:hover .thumb img{filter:brightness(1.05) saturate(1.05)}
.empty{border:1.5px dashed var(--line);border-radius:3px;padding:44px 28px;max-width:40rem}
.empty p{margin:0 0 .4em}.empty p:first-child{font-family:var(--serif);font-size:1.5rem}.empty p+p{color:var(--muted)}

@media (max-width:720px){
  .shelf{grid-template-columns:1fr;gap:14px;padding:22px 0}
  .shelf-strip{grid-template-columns:repeat(3,1fr)}.shelf-strip .thumb:nth-child(4){display:none}
  .intro{padding:36px 0 24px}
}

/* viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:5}
#stage{position:absolute;inset:0}
#stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.v-panel{position:absolute;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);border-radius:6px}
.v-head{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;max-width:min(410px,calc(100% - 32px));padding:14px 18px 16px}
.v-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.1;margin:6px 0 6px}
.v-head #vvar{margin-top:8px;color:var(--ink);font-size:.95rem}.v-head #vvar span{color:var(--moss);font-weight:700;margin-right:4px}
.v-head p{margin:0;color:var(--muted);font-size:.98rem;line-height:1.45}
.v-specs{top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;padding:12px 16px;margin:0;display:grid;gap:6px;font-size:.92rem;min-width:180px}
.v-specs div{display:flex;justify-content:space-between;gap:18px}.v-specs dt{color:var(--muted)}.v-specs dd{margin:0;font-variant-numeric:tabular-nums}
.v-specs:empty{display:none}
.v-bar{left:0;right:0;margin:0 auto;width:max-content;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px;align-items:center;padding:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
.v-bar button{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:7px 13px;cursor:pointer}
.v-bar button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:5px;padding:2px}
.seg button[aria-checked="true"]{background:var(--raise);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.v-bar .pair{color:var(--accent);font-weight:700}
.tog[aria-pressed="true"]{color:var(--accent);font-weight:700}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;border:0;cursor:pointer;color:var(--ink)}
.v-nav svg{width:20px;height:20px}.v-nav.prev{left:12px}.v-nav.next{right:12px}
.v-nav:hover{color:var(--accent)}
.v-anims:not([hidden])~.v-nav.next{right:258px}
.v-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);text-align:center;margin:0;color:#fff;font-size:.88rem;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;opacity:.85}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:1.3rem;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
[hidden]{display:none!important}
.v-anims{right:16px;top:calc(env(safe-area-inset-top,0px) + 140px);width:230px;padding:12px 10px 12px;max-height:calc(100% - 240px);display:flex;flex-direction:column}
.v-opts{right:16px;top:calc(env(safe-area-inset-top,0px) + 140px);width:230px;padding:12px 14px 14px}.v-opts h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 8px}
#viewer.has-anims .v-opts{left:68px;right:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:330px;max-height:42vh;overflow:auto}
.opt-row{margin:0 0 10px}.opt-row:last-child{margin:0}.opt-row h3{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--muted);margin:0 0 5px}
.opt-seg{display:flex;flex-wrap:wrap;gap:4px}.opt-seg button{font:inherit;font-size:.88rem;color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent);border:0;border-radius:4px;padding:5px 9px;cursor:pointer}.opt-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw button{aspect-ratio:1;border:2px solid transparent;border-radius:5px;cursor:pointer;padding:0;background-clip:padding-box}.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--raise) inset}
.v-anims h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 6px 6px}
.v-anims ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 auto}
.v-anims li button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:inherit;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:5px 8px;cursor:pointer;text-align:left}
.v-anims li button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.v-anims li button[aria-pressed="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.an-name{font-size:.98rem}.an-meta{font-size:.8rem;color:var(--muted);white-space:nowrap}
#animNote{margin:8px 8px 8px;font-size:.85rem;color:var(--muted);min-height:1.2em}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin:0 6px 10px}.tools button{font:inherit;font-size:.85rem;color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent);border:0;border-radius:4px;padding:4px 8px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--accent);color:#fff}
.speed{margin:0 6px;align-self:flex-start}.speed button{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
.speed button[aria-checked="true"]{background:var(--raise);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 18%,transparent)}
@media (max-width:720px){
  .v-anims{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;left:8px;right:8px;width:auto;max-height:none;padding:6px;flex-direction:column;gap:6px}
  .v-anims h2,#animNote,.an-meta,.speed{display:none}
  .v-anims ul{display:flex;gap:4px;overflow-x:auto;flex:none;scrollbar-width:none}.v-anims ul::-webkit-scrollbar{display:none}
  .v-anims li{flex:none}.v-anims li button{white-space:nowrap;padding:7px 11px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .tools{flex-wrap:nowrap;overflow-x:auto;margin:0;scrollbar-width:none}.tools button{flex:none;white-space:nowrap;padding:6px 10px}
  .v-opts{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;width:auto;padding:8px}.v-opts h2{display:none}.sw{grid-template-columns:repeat(8,1fr);gap:6px}
  .v-opts{max-height:42vh;overflow:auto}.opt-row{margin:0 0 6px}.opt-row h3{font-size:.78rem;margin:0 0 3px}.opt-seg button{padding:4px 8px;font-size:.82rem}
  #viewer.has-opts .v-head{top:calc(env(safe-area-inset-top,0px) + var(--opth,60px) + 16px)}
  #viewer.has-anims .v-opts{top:calc(env(safe-area-inset-top,0px) + 98px);bottom:auto;left:8px;right:8px;width:auto;max-height:17vh}
  #viewer.has-anims.has-opts .v-head #vvar{display:none}
  #viewer.has-anims.has-opts .v-head{top:calc(env(safe-area-inset-top,0px) + 98px + var(--opth,60px) + 12px)}
  #viewer.has-anims .v-head{top:calc(env(safe-area-inset-top,0px) + 98px)}
  .v-head{padding:8px 12px 10px;max-width:calc(100% - 16px);left:8px}.v-head h1{font-size:1.35rem;margin:2px 0}.v-head #vdesc,.v-head .crumbs{display:none}
  .v-head #vvar{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.85rem;margin-top:2px}
  .v-specs,.v-hint,.sep{display:none}
  .v-nav{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:none;height:44px}
  .v-anims:not([hidden])~.v-nav.next{right:12px}
}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}.thumb:not(.ready)::after{animation:none}}
</style>
</head>
<body>
<div id="library" class="shell">
  <header class="top"><a class="mark" href="#/">Asset Forge</a><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav></header>
  <main id="app"></main>
</div>
<section id="viewer" hidden aria-label="3D viewer">
  <div id="stage"></div>
  <div id="loading">Building model…</div>
  <div class="v-panel v-head"><nav class="crumbs" id="vcrumbs" aria-label="Breadcrumb"></nav><h1 id="vname"></h1><p id="vdesc"></p><p id="vvar" hidden></p></div>
  <dl class="v-panel v-specs" id="vspecs"></dl>
  <div class="v-panel v-opts" id="vopts" hidden><h2>Options</h2><div id="optbody"></div></div>
  <div class="v-panel v-anims" id="vanims" hidden>
    <h2>Animations</h2>
    <ul id="animList"></ul>
    <p id="animNote"></p>
    <div class="tools" id="toolRow" role="group" aria-label="Tool in hand"></div>
    <div class="seg speed" role="radiogroup" aria-label="Playback speed"><button role="radio" data-speed="0.25">¼×</button><button role="radio" data-speed="0.5">½×</button><button role="radio" data-speed="1">1×</button></div>
  </div>
  <button class="v-panel v-nav prev" id="vprev" aria-label="Previous asset"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 3 6 10l7 7"/></svg></button>
  <button class="v-panel v-nav next" id="vnext" aria-label="Next asset"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 3 7 7-7 7"/></svg></button>
  <p class="v-hint">Drag to orbit. Scroll or pinch to zoom. Right-drag or two fingers to pan. WASD to move, Q/E down/up, Shift for speed.</p>
  <div class="v-panel v-bar">
    <div class="seg" role="radiogroup" aria-label="Lighting"><button role="radio" data-mode="day">Day</button><button role="radio" data-mode="dusk">Dusk</button><button role="radio" data-mode="night">Night</button></div>
    <span class="sep"></span>
    <button class="tog" id="tTurn" aria-pressed="false">Turntable</button>
    <button class="tog" id="tWire" aria-pressed="false">Wireframe</button>
    <button id="tPair" class="pair" hidden>Blocky version</button>
    <button id="tVar" hidden>New look</button>
    <button class="tog" id="tRig" aria-pressed="false" hidden>Show rig</button>
    <button id="tExport" title="Download this asset as a .glb file with its current options">Export GLB</button>
    <button id="tReset">Reset view</button>
  </div>
</section>
<!--LOADER-->
<script>
/* Development loader: loads every script listed in src/manifest.json, in order. tools/build.mjs replaces this block with the inlined code. */
(async()=>{const m=await (await fetch('src/manifest.json',{cache:'no-store'})).json();
  for(const src of [...m.vendor,...m.library,...m.app])await new Promise((res,rej)=>{const s=document.createElement('script');s.src=src+'?v='+Date.now();s.async=false;s.onload=res;s.onerror=()=>{console.error('Failed to load '+src);rej(src);};document.body.appendChild(s);});})();
</script>
<!--/LOADER-->
</body>
</html>
